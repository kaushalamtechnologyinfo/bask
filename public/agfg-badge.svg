<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 80" width="140" height="80">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CA161B"/>
      <stop offset="50%" stop-color="#B21418"/>
      <stop offset="100%" stop-color="#930E12"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Clean white badge background -->
  <rect x="1" y="1" width="138" height="78" rx="4" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1.5"/>

  <!-- AGFG Logo Top -->
  <g transform="translate(32, 23)">
    <!-- 'A' and 'G' in dark slate/charcoal -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="21" font-weight="800" fill="#424242" letter-spacing="-1">AG</text>
    <!-- 'F' and 'G' in vibrant AGFG Crimson -->
    <text x="35" y="0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="21" font-weight="800" fill="#B71C1C" letter-spacing="-1">FG</text>
  </g>

  <!-- Red Center Banner -->
  <rect x="0" y="32" width="140" height="24" rx="2" fill="url(#redGrad)" filter="url(#shadow)"/>
  <!-- Highlight line -->
  <line x1="2" y1="33" x2="138" y2="33" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>
  <text x="70" y="48.5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">WRITE A REVIEW</text>

  <!-- Bottom: Checkmark in Square + agfg.com.au -->
  <g transform="translate(14, 60)">
    <!-- Checkbox icon -->
    <rect x="0" y="1" width="12" height="12" rx="1.5" fill="none" stroke="#333333" stroke-width="1.6"/>
    <path d="M2.5 7 L5 9.5 L10 3.5" fill="none" stroke="#333333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- agfg.com.au text -->
    <text x="18" y="11.5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="600" fill="#4B4B4B" letter-spacing="0.2">agfg.com.au</text>
  </g>
</svg>
